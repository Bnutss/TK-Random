name: Build Windows

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get

      - run: flutter test

      - run: flutter build windows --release

      - name: Zip the build output
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath tk_random-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: tk_random-windows
          path: tk_random-windows.zip

      # Only for version-tag pushes (v1.2.3): publishes a public GitHub
      # Release with the zip attached, so the app's in-app update check
      # (lib/services/update_service.dart) has a stable URL to point users
      # at. Plain pushes to main just build and test, no release.
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: tk_random-windows.zip
          generate_release_notes: true
