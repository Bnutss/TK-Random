name: Build Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get

      - run: flutter test

      - run: flutter build windows --release

      - name: Zip the build output
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath tk_random-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: tk_random-windows
          path: tk_random-windows.zip
