name: tk_random
description: "A new Flutter project."

publish_to: 'none'


version: 1.3.0+7

environment:
  sdk: ^3.13.2


dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  path_provider: ^2.1.5
  uuid: ^4.5.1
  pdf: ^3.11.3
  printing: ^5.14.2
  intl: ^0.20.2
  fluent_ui: ^4.11.9
  window_manager: ^0.4.3
  http: ^1.6.0
  url_launcher: ^6.3.2
  package_info_plus: ^10.2.1
  win32: ^6.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0


flutter:
  uses-material-design: true

  assets:
    - assets/images/logo.png

  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
